# Tests and the production build on every push to main and every pull request, so a failing change
# is visible on its commit or pull request. It blocks nothing by itself: make `verify` a required check
# in branch protection for that (docs/GO-LIVE.md). Read-only: it never commits.
name: ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a superseded pull-request run is cancelled; every push to main keeps its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # The frontend tests run before `build` installs frontend/, so its dependencies come first.
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Verify (ingest and backend tests, frontend tests, build, built-site tests, SEO check)
        env:
          SITE_URL: https://ci.example
        run: npm run verify
