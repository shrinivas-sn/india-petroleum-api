# Tests and the production build on every push to main and every pull request, so a change cannot
# reach the branch Vercel deploys without passing them. Read-only: it never commits.
name: ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Verify (ingest and backend tests, frontend tests, build, built-site tests, SEO check)
        env:
          SITE_URL: https://ci.example
        run: npm run verify
