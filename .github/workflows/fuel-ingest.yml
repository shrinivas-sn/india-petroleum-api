# Daily fuel ingestion: download the PPAC metro PDF, check it, commit data/fuel/ only when
# something truly changed. Runs every three hours because PPAC's posting time is irregular; a run is
# idempotent (no new day means no commit) and costs a few seconds. The schedule is also the outer
# retry for a failed download. A failed or stale run opens one rolling issue; a good run closes it.
# What to do when a check refuses the data is in docs/GO-LIVE.md.
name: fuel-ingest

on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fuel-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install poppler-utils
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          { echo '### pdftotext on this runner'; echo '```'; pdftotext -v 2>&1 | head -n 1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Ingest
        id: ingest
        continue-on-error: true
        run: node ingest/run-fuel.js

      - name: Tests
        if: steps.ingest.outcome == 'success'
        run: npm test

      - name: Keep the PDF and the failure report when a check refused the data
        if: always() && steps.ingest.outcome == 'failure' && hashFiles('work/daily.pdf') != ''
        uses: actions/upload-artifact@v7
        with:
          name: fuel-ingest-failure-${{ github.run_id }}
          path: |
            work/daily.pdf
            work/failure-report.txt
          retention-days: 7

      - name: Commit only if data actually changed
        if: steps.ingest.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel
          if git diff --cached --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -m "$(cat work/commit-message.txt)"
          # The download log line of this run is not committed (eight runs a day would only add noise).
          git restore proof/download-log.jsonl 2>/dev/null || true
          for attempt in 1 2 3; do
            if git pull --rebase -q && git push; then break; fi
            if [ "$attempt" = 3 ]; then echo "push failed after 3 attempts"; exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Fail the job when ingestion failed
        if: steps.ingest.outcome == 'failure'
        run: exit 1

  freshness:
    needs: ingest
    if: always() && needs.ingest.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Newest stored day is at most two IST days old
        run: node ingest/freshness.js | tee -a "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [ingest, freshness]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open, update or close the rolling failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INGEST: ${{ needs.ingest.result }}
          FRESHNESS: ${{ needs.freshness.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search "Daily fuel ingestion is failing in:title" --json number,title --jq '[.[] | select(.title == "Daily fuel ingestion is failing")][0].number // empty')
          if [ "$INGEST" = "success" ] && [ "$FRESHNESS" != "failure" ]; then
            if [ -n "$number" ]; then gh issue close "$number" --comment "Recovered in $RUN_URL"; fi
            exit 0
          fi
          if [ "$INGEST" != "failure" ] && [ "$FRESHNESS" != "failure" ]; then exit 0; fi
          body="The latest run did not end well (ingest: $INGEST, freshness: $FRESHNESS). Run: $RUN_URL. The site keeps serving the last prices that were fetched; its status page shows how old they are. What to do for each kind of refusal is in docs/GO-LIVE.md. This issue closes itself when a run succeeds."
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "Daily fuel ingestion is failing" --body "$body"
          fi
